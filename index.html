<style>
/* Layout: one-screen phone app. Sticky clock header, scrolling game view, fixed bottom nav. Light-first for sunlight. */
:root{
  --bg:#ffffff; --fg:#0e1711; --mut:#5a6a5e; --line:#d5ddd6; --card:#f1f5f1; --card2:#e4ebe5;
  --pitch:#2f8f41; --pitch2:#2a8139; --team:#0b4fc2; --pline:rgba(255,255,255,.75); --bub:#ffffff; --bubfg:#0e1711;
  --act:#0b4fc2; --actfg:#fff; --sub:#ec6d0b; --subfg:#fff;
  --ok:#168a38; --warn:#c98d00; --bad:#d3261a; --badbg:#fde6e3; --warnbg:#fff3d1; --okbg:#e2f5e7;
  --test:#7b2cbf; --testbg:#f1e6fb;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d120f; --fg:#f1f5f1; --mut:#9faea3; --line:#28332b; --card:#161e18; --card2:#1f2a22;
  --pitch:#246f33; --pitch2:#1f6330; --pline:rgba(255,255,255,.6); --bub:#f6f8f6; --bubfg:#0e1711;
  --act:#5b8dff; --sub:#ff7a1a; --badbg:#3a1613; --warnbg:#3a2d08; --okbg:#10301a; --testbg:#2a1540; --team:#5b8dff;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d120f; --fg:#f1f5f1; --mut:#9faea3; --line:#28332b; --card:#161e18; --card2:#1f2a22;
  --pitch:#246f33; --pitch2:#1f6330; --pline:rgba(255,255,255,.6); --bub:#f6f8f6; --bubfg:#0e1711;
  --act:#5b8dff; --sub:#ff7a1a; --badbg:#3a1613; --warnbg:#3a2d08; --okbg:#10301a; --testbg:#2a1540; --team:#5b8dff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.25;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;font-family:var(--font);color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--act);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px}
h1,h2,h3{margin:0;text-wrap:balance}
#app{height:100%;display:flex;flex-direction:column}
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view{flex:1;overflow-y:auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
#nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#nav button{min-height:56px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#nav button .ic{font-size:20px;line-height:1}
#nav button.on{color:var(--act)}
#hdr{border-bottom-color:var(--act)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 16px;border-radius:12px;font-weight:900;font-size:17px;letter-spacing:.02em;text-transform:uppercase;background:var(--card2);color:var(--fg);text-align:center}
.btn.act{background:var(--act);color:var(--actfg)}
.btn.sub{background:var(--sub);color:var(--subfg)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.ghost{background:none;border:2px solid var(--line)}
.btn.big{min-height:66px;font-size:20px}
.btn.sm{min-height:42px;font-size:14px;padding:6px 12px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.btn.flash{animation:flash 1s infinite}
@keyframes flash{50%{box-shadow:0 0 0 5px var(--bad)}}
@media (prefers-reduced-motion:reduce){.btn.flash{animation:none;box-shadow:0 0 0 4px var(--bad)}}
.card{background:var(--card);border-radius:14px;padding:14px}
/* clock header */
.clockrow{display:flex;align-items:center;gap:10px}
.clock{font-size:40px;font-weight:900;line-height:1;letter-spacing:-.02em}
.half{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.chk{font-size:14px;font-weight:800;color:var(--mut)}
.chk.due{color:var(--bad)}
.scorebar{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;align-items:center;margin-top:6px}
.scorebar .btn.sm{min-height:40px;font-size:14px}
.sbtn{display:flex;flex-direction:column;align-items:center;min-width:56px}
.sbtn .sl{font-size:11px;font-weight:900;letter-spacing:.06em;color:var(--mut)}
.sbtn .sn{font-size:26px;font-weight:900;line-height:1}
.hbtns{display:flex;gap:8px;margin-top:8px}
.hbtns .btn{flex:1;min-height:48px;font-size:15px;padding:6px 8px}
.testbar{margin-top:8px;background:var(--testbg);border:2px dashed var(--test);border-radius:12px;padding:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.testbar .lbl{color:var(--test)}
.testbar .btn{min-height:44px;font-size:15px;background:var(--test);color:#fff;padding:6px 10px}
/* pitch */
.pitch{position:relative;width:100%;height:0;padding-bottom:92%;max-width:100%;background:repeating-linear-gradient(180deg,var(--pitch) 0 12.5%,var(--pitch2) 12.5% 25%);border-radius:14px;border:3px solid var(--pline);overflow:hidden}
.pitch::before{content:"";position:absolute;left:50%;top:-14%;width:50%;padding-bottom:50%;height:0;transform:translateX(-50%);border:3px solid var(--pline);border-radius:50%;opacity:.5}
.pitch::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:18%;border:3px solid var(--pline);border-bottom:0;border-radius:6px 6px 0 0;opacity:.7}
.bub{position:absolute;transform:translate(-50%,-50%);width:30%;min-width:92px;
}
.pitch.big .bub{width:24%;min-width:70px;padding:3px 2px}
.pitch.big .bub .nm{font-size:13px}
.pitch.big .bub .tm{font-size:13px}
.pitch.big .bub .pos{font-size:9px}
.bub{background:var(--bub);color:var(--bubfg);border-radius:12px;padding:4px 4px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
.bub .pos{font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#2f6f3a;white-space:nowrap}
.bub .nm{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bub .nm small{font-weight:700;color:#5a6a5e;font-size:12px}
.bub .tm{font-size:16px;font-weight:800}
.bub.empty{background:rgba(255,255,255,.35);color:#fff;border:2px dashed #fff}
.bub.empty .nm{font-size:13px}
.bub.out{box-shadow:0 0 0 4px var(--bad),0 3px 8px rgba(0,0,0,.35)}
.bub.low{box-shadow:0 0 0 4px var(--warn),0 3px 8px rgba(0,0,0,.35)}
/* rec */
.rec{background:var(--card);border-radius:16px;padding:14px;border:3px solid transparent}
.rec.due{border-color:var(--sub)}
.rec .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.rec .who{border-radius:12px;padding:10px;color:#fff}
.rec .who.in{background:var(--ok)}
.rec .who.out{background:var(--bad)}
.rec .who .dir{font-size:13px;font-weight:900;letter-spacing:.08em}
.rec .who .n{font-size:24px;font-weight:900;line-height:1.05;margin-top:2px;word-break:break-word}
.rec .who .p{font-size:15px;font-weight:800;margin-top:4px;opacity:.95}
.rec .sent{font-size:26px;font-weight:900;line-height:1.15;margin-top:8px}
.rec .sent b{font-weight:900}
.bp.nx{box-shadow:inset 0 0 0 3px var(--sub)}
.rec .pick2{border-top:2px solid var(--line);margin-top:8px;padding-top:6px}
.rec .sent.small{font-size:21px}
.rec .why{margin-top:8px;font-size:14px;color:var(--mut);font-weight:700}
.rec .acts{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:10px}
.rec .acts .btn{min-height:64px}
.alt{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:8px 10px;margin-top:8px;font-weight:800;font-size:15px}
.alt .btn{min-height:44px}
.warn{background:var(--badbg);border-left:6px solid var(--bad);border-radius:10px;padding:10px 12px;font-weight:900;font-size:16px}
.warn.w{background:var(--warnbg);border-left-color:var(--warn)}
/* bench */
.bench{display:flex;flex-direction:column;gap:8px}
.bp{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.bp .rank{width:48px;font-size:13px;font-weight:900;letter-spacing:.04em;color:var(--mut);flex:none}
.bp .rank.next{color:var(--sub)}
.bp .nm{font-size:19px;font-weight:900}
.bp .nm small{font-weight:700;color:var(--mut);font-size:14px}
.bp .ps{font-size:13px;font-weight:800;color:var(--mut);letter-spacing:.04em}
.bp .st{text-align:right;flex:none;font-size:14px;font-weight:800;color:var(--mut);line-height:1.3}
.bp .st b{color:var(--fg);font-size:16px}
.bp.pri{box-shadow:inset 0 0 0 3px var(--bad)}
/* lists / tables */
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:10px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
td.r,th.r{text-align:right}
.tag{display:inline-block;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.w{background:var(--warnbg);color:var(--warn)}
.tag.b{background:var(--badbg);color:var(--bad)}
.tag.g{background:var(--card2);color:var(--mut)}
.q{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;font-size:17px}
.q .qp{width:40px;font-weight:900;color:var(--mut);letter-spacing:.06em}
.q .on{color:var(--ok)}
.q .away{color:var(--mut);font-weight:600}
.chatlist{display:flex;flex-direction:column;gap:8px}
.msg{background:var(--card);border-radius:12px;padding:8px 12px;max-width:88%;align-self:flex-start}
.msg.me{background:var(--act);color:var(--actfg);align-self:flex-end}
.msg .mh{font-size:12px;font-weight:800;opacity:.75}
.msg .mdel{float:right;margin-left:8px;min-width:28px;min-height:22px;font-weight:900;opacity:.7}
.msg .mb{font-size:17px;font-weight:700;margin-top:2px;word-break:break-word}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);font-weight:900;font-size:15px}
.chip.on{background:var(--act);border-color:var(--act);color:var(--actfg)}
.chip.on2{background:var(--card2);border-color:var(--mut)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:12px;padding:12px 14px;font-weight:800;min-height:56px;width:100%;text-align:left}
.toggle .sw{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on .sw{background:var(--ok)}
.toggle.on .sw::after{left:25px}
.num{display:flex;align-items:center;gap:8px}
.num input{width:90px;text-align:center;font-weight:900;font-size:20px}
.num .btn{min-height:48px;width:52px;padding:0}
.rp{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;width:100%;text-align:left}
.rp .nm{font-size:18px;font-weight:900}
.rp .nm small{color:var(--mut);font-weight:700}
.rp.off{opacity:.5}
.rp .ps{font-size:13px;font-weight:800;color:var(--mut)}
/* sheet */
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}
#sheet{background:var(--bg);width:100%;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding-block:14px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
#sheet h2{font-size:20px;font-weight:900}
.opt{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:12px 14px;width:100%;text-align:left;min-height:60px}
.opt .nm{font-size:19px;font-weight:900}
.opt .nm small{color:var(--mut);font-weight:700;font-size:14px}
.opt .sub2{font-size:14px;font-weight:700;color:var(--mut)}
.opt.dim{opacity:.55}
.opt .arrow{margin-left:auto;font-weight:900;color:var(--mut)}
.sec{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.center{text-align:center}
.big{font-size:22px;font-weight:900}
.sum td{font-size:17px;font-weight:800}
.hist{background:var(--card);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.log{display:flex;gap:10px;align-items:baseline;font-weight:800;font-size:15px;padding:6px 0;border-bottom:1px solid var(--line)}
.log .t{color:var(--mut);width:52px;flex:none}
.in{color:var(--ok)} .outc{color:var(--bad)}
.resume{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.ro [data-a=start],.ro [data-a=pause],.ro [data-a=halftime],.ro [data-a=second],.ro [data-a=end],.ro [data-a=goalus_pick],.ro [data-a=goalthem],.ro [data-a=makesub],.ro [data-a=altsub],.ro [data-a=undo],.ro [data-a=suggest],.ro [data-a=clearlineup],.ro [data-a=kickoff],.ro [data-a=addplayer],.ro [data-a=toggleavail],.ro [data-a=editplayer] ,.ro [data-a=pushupdate],.ro [data-a=resetroster],.ro [data-a=wipe],.ro .testbar,.ro .edithint,.ro #opp,.ro .num{display:none!important}
.ro .bub,.ro .bp,.ro .rp,.ro [data-a=edittime]{pointer-events:none}
.ro .rec .acts{display:none}
.ro .pitch::after{pointer-events:none}
.ro .rp button{pointer-events:none}
.viewerpill{display:inline-block;background:var(--card2);color:var(--mut);font-size:11px;font-weight:900;letter-spacing:.1em;padding:3px 8px;border-radius:6px}
.testpill{display:inline-block;background:var(--test);color:#fff;font-size:11px;font-weight:900;letter-spacing:.1em;padding:3px 8px;border-radius:6px}
</style>

<script>
'use strict';
const SYNC_BASE='https://bridge-blue-default-rtdb.firebaseio.com'; // shared home for every team
const ADMIN_CODE='TURNER-ADMIN';
function TEAMNAME(){ return (S.team&&S.team.name)||'Sideline Sub'; }
function COACHNAME(){ return (S.team&&S.team.coach)||''; }
function CODE(){ return (S.team&&S.team.code)||''; }
const APP_VERSION=(window.BB_BUILD||0);
const IS_APK=location.protocol==='file:';
/* ====================== DATA ====================== */
const FORMATIONS = {
  '5v5': {name:'5v5 · 1-1-2-1', slots:[
    {id:'ST',role:'ST',x:50,y:14},{id:'LW',role:'LW',x:25,y:42},{id:'RW',role:'RW',x:75,y:42},{id:'CB',role:'CB',x:50,y:62},{id:'GK',role:'GK',x:50,y:86}]},
  '7v7': {name:'7v7 · 1-2-3-1', slots:[
    {id:'ST',role:'ST',x:50,y:14},{id:'LW',role:'LW',x:17,y:37},{id:'CM',role:'CM',x:50,y:37},{id:'RW',role:'RW',x:83,y:37},{id:'LB',role:'LB',x:30,y:63},{id:'RB',role:'RB',x:70,y:63},{id:'GK',role:'GK',x:50,y:86}]},
  '9v9': {name:'9v9 · 1-3-3-2', slots:[
    {id:'ST',role:'ST',x:34,y:12},{id:'ST2',role:'ST',x:66,y:12},{id:'LW',role:'LW',x:17,y:36},{id:'CM',role:'CM',x:50,y:36},{id:'RW',role:'RW',x:83,y:36},{id:'LB',role:'LB',x:22,y:62},{id:'CB',role:'CB',x:50,y:62},{id:'RB',role:'RB',x:78,y:62},{id:'GK',role:'GK',x:50,y:86}]},
  '11v11': {name:'11v11 · 1-4-3-3', slots:[
    {id:'LW',role:'LW',x:20,y:12},{id:'ST',role:'ST',x:50,y:10},{id:'RW',role:'RW',x:80,y:12},{id:'CM',role:'CM',x:28,y:36},{id:'CM2',role:'CM',x:50,y:34},{id:'CM3',role:'CM',x:72,y:36},{id:'LB',role:'LB',x:14,y:62},{id:'CB',role:'CB',x:38,y:64},{id:'CB2',role:'CB',x:62,y:64},{id:'RB',role:'RB',x:86,y:62},{id:'GK',role:'GK',x:50,y:88}]},
};
const ROLES=['GK','LB','CB','RB','LW','CM','RW','ST'];
const RNAME={GK:'Goalkeeper',LB:'Left Back',CB:'Center Back',RB:'Right Back',LW:'Left Wing',CM:'Center Mid',RW:'Right Wing',ST:'Striker'};
let POS=[], POSID=[], ROLE={}, PNAME={};
function setFormation(key){
  const f=FORMATIONS[key]||FORMATIONS['7v7'];
  POS=f.slots; POSID=POS.map(p=>p.id); ROLE=Object.fromEntries(POS.map(p=>[p.id,p.role]));
  PNAME=Object.fromEntries(POS.map(p=>[p.id,RNAME[p.role]+(POS.filter(q=>q.role===p.role).length>1?' '+(POS.filter(q=>q.role===p.role).indexOf(p)+1):'')]));
  Object.assign(PNAME,RNAME);
}
setFormation('7v7');

const GROUPS = {core:'Core',dev:'Developing',support:'Needs support'};
const GW = {core:0,dev:1,support:2};

const DEFAULT_SETTINGS = {formation:'7v7', gameLen:50, halfLen:25, subInterval:5, minTarget:20, maxSubs:2, balance:true, weakMax:4, gkAuto:false, gkInterval:12, testMode:false, testTimers:true, autoUpdate:true};

function defaultRoster(){
  const r=(id,name,num,primary,auto,manual,group)=>({id,name,num,primary,auto,manual,group,avail:true,starts:0,benchStarts:0,games:0});
  return [
    r('adrien','Adrien',5,'RB',['RB','RW','CB'],[],'core'),
    r('isaiah','Isaiah',10,'RW',['RW'],[],'dev'),
    r('bennett','Bennett',13,'GK',['GK'],[],'core'),
    r('blake','Blake',14,'LB',['LB','RB','CB'],['GK'],'core'),

let G = null; // alias for S.game
function syncQueues(){
  for(const p of ROLES){
    if(!S.queues[p]) S.queues[p]=[];
    S.queues[p]=S.queues[p].filter(id=>{const pl=player(id);return pl&&(pl.auto.includes(p)||pl.manual.includes(p));});

function player(id){ return S.roster.find(p=>p.id===id); }
function availRoster(){ return S.roster.filter(p=>p.avail); }
function uid(){ return 'p'+Math.random().toString(36).slice(2,8); }

/* ====================== TIME ====================== */
const fmt=s=>{ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function clock(){ if(!G) return 0; return G.base + (G.running ? (Date.now()-G.startedAt)/1000 : 0); }
function setBase(v){ G.base=v; if(G.running) G.startedAt=Date.now(); }
function startClock(){ if(!G.running){ G.running=true; G.startedAt=Date.now(); } }
function stopClock(){ if(G.running){ G.base=clock(); G.running=false; G.startedAt=null; } }
function ps(id){ if(!G.ps[id]) G.ps[id]={played:0,since:clock(),onField:false,maxBench:0,positions:{}}; return G.ps[id]; }
function played(id,c){ const p=ps(id); return p.played + (p.onField ? c-p.since : 0); }
function fieldStint(id,c){ const p=ps(id); return p.onField ? c-p.since : 0; }
function benchStint(id,c){ const p=ps(id); return p.onField ? 0 : Math.max(0,c-p.since); }
function fieldIds(){ return POSID.map(p=>G.field[p]).filter(Boolean); }
function posOf(id){ return POSID.find(p=>G.field[p]===id)||null; }
function benchIds(){ const f=fieldIds(); return availRoster().map(p=>p.id).filter(id=>!f.includes(id)); }
function gameSecs(){ return S.settings.gameLen*60; }
function halfSecs(){ return S.settings.halfLen*60; }

/* ====================== PLAYING-TIME STATUS ====================== */
// Returns {code, needed, remaining, projected}
function ptStatus(id,c){
  const target=S.settings.minTarget*60, pl=played(id,c), remaining=Math.max(0,gameSecs()-c), needed=target-pl;
  const n=availRoster().length||1, share=remaining*(POSID.length/n);
  const projected=pl+share;
  if(needed<=0) return {code:'ok',needed:0,remaining,projected};
  if(remaining<=0) return {code:'missed',needed,remaining,projected};
  if(needed>remaining) return {code:'cant',needed,remaining,projected};
  if(needed>remaining*0.8 || projected<target) return {code:'priority',needed,remaining,projected};
  if(projected<target+120) return {code:'watch',needed,remaining,projected};
  return {code:'ok',needed,remaining,projected};
}
const URG={ok:0,watch:4,priority:12,cant:20,missed:0};

/* ====================== SUB ALGORITHM ====================== */
function lineupWeak(field){ return Object.values(field).filter(Boolean).reduce((a,id)=>a+(GW[player(id).group]||0),0); }
function nextInQueue(pos){ // first queue member not on field
  const f=fieldIds(); return (S.queues[ROLE[pos]]||[]).find(id=>!f.includes(id)&&player(id)&&player(id).avail)||null;
}
function candidates(c){
  const st=S.settings, bench=benchIds(), out=[];
  const avgPlayed = availRoster().reduce((a,p)=>a+played(p.id,c),0)/(availRoster().length||1);
  const curWeak=lineupWeak(G.field);
  for(const pos of POSID){
    const outId=G.field[pos]; if(!outId) continue;
    if(ROLE[pos]==='GK' && !st.gkAuto) continue;
    if(ROLE[pos]==='GK' && fieldStint(outId,c)<st.gkInterval*60) continue;
    for(const inId of bench){
      const pin=player(inId); if(!pin.auto.includes(ROLE[pos])) continue;
      const pout=player(outId);
      let sc=0; const why=[];
      const bs=benchStint(inId,c)/60, fs=fieldStint(outId,c)/60;
      const last=G.subs.length?G.subs[G.subs.length-1]:null;
      if(last && last.inId===outId && last.outId===inId) continue; // never suggest undoing the last sub
      const urgent=['priority','cant'].includes(ptStatus(inId,c).code);
      const settle=Math.min(3,st.subInterval/2);
      if(c>0 && !urgent && (fs<settle || bs<settle)) continue; // just moved: let it settle
      sc += bs*1.0;
      sc += fs*0.6 + (fs>st.subInterval*2 ? (fs-st.subInterval*2)*1.5 : 0);
      const defIn=(avgPlayed-played(inId,c))/60, surOut=(played(outId,c)-avgPlayed)/60;
      sc += defIn*1.5 + surOut*1.0;
      const stIn=ptStatus(inId,c); sc += URG[stIn.code];
      if(stIn.code==='priority'||stIn.code==='cant') why.push(pin.name+' behind on minutes');
      const stOut=ptStatus(outId,c); sc -= URG[stOut.code]*1.5 + stOut.needed/60;
      if(nextInQueue(pos)===inId){ sc+=5; why.push('Next in '+pos+' rotation'); }
      if(pin.primary===ROLE[pos]) sc+=2;
      if(pout.primary===ROLE[pos] && pin.primary!==ROLE[pos]) sc-=1;
      if(fs<3) sc-=15; else if(fs<5) sc-=6;
      if(bs<3 && c>0) sc-=10;
      if(urgent && (fs<settle||bs<settle)) sc-=10;
      if(st.balance){
        const nf={...G.field,[pos]:inId}; const w=lineupWeak(nf);
        sc -= Math.max(0,w-curWeak)*1;
        if(w>st.weakMax) sc -= (w-st.weakMax)*12;
      }
      if(!why.length){ if(fs>=bs) why.push(pout.name+' has played '+fmt(fs*60)+' straight'); else why.push(pin.name+' has sat '+fmt(bs*60)); }
      out.push({inId,outId,pos,sc,why:why[0]});
    }
  }
  out.sort((a,b)=>b.sc-a.sc);
  return out;
}
function recommendation(c){
  const cands=candidates(c); if(!cands.length) return {list:[],first:null,second:null,picks:[]};
  const idx=G.altIdx % cands.length; const first=cands[idx];
  const picks=[first]; let nf={...G.field,[first.pos]:first.inId};
  const want=Math.max(1,Math.min(3,S.settings.maxSubs||1));
  while(picks.length<want){
    const usedIn=new Set(picks.map(x=>x.inId)), usedOut=new Set(picks.map(x=>x.outId)), usedPos=new Set(picks.map(x=>x.pos));
    const nx=cands.find(x=>!usedIn.has(x.inId)&&!usedOut.has(x.outId)&&!usedPos.has(x.pos)&&(!S.settings.balance||lineupWeak({...nf,[x.pos]:x.inId})<=S.settings.weakMax));
    if(!nx) break; picks.push(nx); nf={...nf,[nx.pos]:nx.inId};
  }
  return {list:cands,first,second:picks[1]||null,picks};
}
function makeSubs(list){ G._batch='b'+Date.now(); for(const x of list){ if(G.field[x.pos]===x.outId && benchIds().includes(x.inId)) makeSub(x.inId,x.outId,x.pos,false); } G._batch=null; save(); render(); }

/* ====================== GAME ACTIONS ====================== */
function newGame(){
  applyFormation();
  S.game=G={phase:'setup',base:0,running:false,startedAt:null,field:Object.fromEntries(POSID.map(p=>[p,null])),ps:{},subs:[],undo:[],lastCheck:0,altIdx:0,starting:null,date:new Date().toISOString(),opponent:'',goals:[]};
  save();
}
function snapshot(){ return JSON.stringify({field:G.field,ps:G.ps,queues:S.queues,lastCheck:G.lastCheck,subs:G.subs.length,goals:G.goals||[],batchId:G._batch||null}); }
function pushUndo(){ G.undo.push(snapshot()); if(G.undo.length>12) G.undo.shift(); }
function undo(){
  let s=G.undo.pop(); if(!s) return;
  // if the last subs were made as a batch, roll back to before the batch
  const d0=JSON.parse(s); if(d0.batchId){ while(G.undo.length&&JSON.parse(G.undo[G.undo.length-1]).batchId===d0.batchId) s=G.undo.pop(); }
  const d=JSON.parse(s); G.field=d.field; G.ps=d.ps; S.queues=d.queues; G.lastCheck=d.lastCheck; G.subs=G.subs.slice(0,d.subs); G.goals=d.goals||[]; G.altIdx=0;
  save(); render();
}
function queueRotate(pos,inId,outId){
  pos=ROLE[pos]||pos; const q=S.queues[pos]||[];
  if(outId){ const i=q.indexOf(outId); if(i>=0){ q.splice(i,1); q.push(outId); } }
  const j=q.indexOf(inId); if(j>=0) q.splice(j,1); q.unshift(inId);
  S.queues[pos]=q;
}
function makeSub(inId,outId,pos,manual){
  const c=clock(); pushUndo();
  const po=ps(outId); po.played+=Math.max(0,c-po.since); po.since=c; po.onField=false;
  const pi=ps(inId); pi.maxBench=Math.max(pi.maxBench,c-pi.since); pi.since=c; pi.onField=true; pi.positions[pos]=(pi.positions[pos]||0)+1;
  G.field[pos]=inId;
  queueRotate(pos,inId,outId);
  G.subs.push({t:c,inId,outId,pos,manual:!!manual});
  G.lastCheck=c; G.altIdx=0;
  save(); render(); const v=$('#view'); if(v) v.scrollTop=0;
}
function swapField(a,b){ // two field players exchange positions
  const pa=posOf(a), pb=posOf(b); if(!pa||!pb) return; pushUndo();
  G.field[pa]=b; G.field[pb]=a; ps(a).positions[pb]=(ps(a).positions[pb]||0)+1; ps(b).positions[pa]=(ps(b).positions[pa]||0)+1;
  queueRotate(pb,a,null); queueRotate(pa,b,null);
  G.subs.push({t:clock(),swap:[a,b],pos:pb+'/'+pa}); save(); render();
}
function kickoff(){
  if(POSID.some(p=>!G.field[p])) return;
  G.phase='h1'; G.base=0; G.running=false; G.ps={};
  for(const p of availRoster()){ const x=ps(p.id); x.since=0; }
  for(const pos of POSID){ const id=G.field[pos]; ps(id).onField=true; ps(id).positions[pos]=1; queueRotate(pos,id,null); }
  G.starting={...G.field}; G.lastCheck=0;
  for(const p of availRoster()){ p.games=(p.games||0)+1; if(fieldIds().includes(p.id)) p.starts=(p.starts||0)+1; else p.benchStarts=(p.benchStarts||0)+1; }
  save(); render();
}
function halftime(){ stopClock(); G.phase='ht'; save(); render(); }
function secondHalf(){ G.phase='h2'; setBase(Math.max(clock(),halfSecs())); G.lastCheck=clock(); save(); render(); }
function editClock(newC,apply){
  const delta=newC-clock();
  if(!apply){ for(const id in G.ps) G.ps[id].since+=delta; }
  else if(delta<0){ for(const id in G.ps) G.ps[id].since=Math.min(G.ps[id].since,newC); }
  setBase(newC);
  if(G.phase==='h1' && newC>halfSecs()) G.phase='h2';
  if(G.lastCheck>newC) G.lastCheck=newC;

function endGame(){
  stopClock(); const c=clock();
  for(const id in G.ps){ const p=G.ps[id]; if(p.onField){ p.played+=Math.max(0,c-p.since);} else { p.maxBench=Math.max(p.maxBench,c-p.since);} p.since=c; p.final=true; }
  G.phase='done'; G.endClock=c;
  const rec={date:G.date,opponent:G.opponent,score:score(),goals:G.goals||[],len:c,starting:G.starting,subs:G.subs,players:availRoster().map(p=>({id:p.id,name:p.name,num:p.num,played:G.ps[p.id]?G.ps[p.id].played:0,positions:Object.keys(G.ps[p.id]?G.ps[p.id].positions:{}),maxBench:G.ps[p.id]?G.ps[p.id].maxBench:0,start:G.starting&&Object.values(G.starting).includes(p.id)})),target:S.settings.minTarget};
  S.history.unshift(rec); if(S.history.length>40) S.history.length=40;
  save(); render();

function suggestLineup(){
  const avail=availRoster(); const used=new Set(); const field={};
  const order=[...POSID].sort((a,b)=>['GK','LW','CB','RB','LB','ST','RW','CM'].indexOf(ROLE[a])-['GK','LW','CB','RB','LB','ST','RW','CM'].indexOf(ROLE[b]));
  const maxStarts=Math.max(0,...avail.map(p=>p.starts||0));
  // each tap: players who were just on the field get a penalty, so the next suggestion benches them first
  // rotate: count how often each player has been suggested as a starter this pre-game; least-suggested wins ties
  G.suggestN=(G.suggestN||0)+1; G.sugCount=G.sugCount||{};
  if(G.suggestN>1) for(const id of Object.values(G.field).filter(Boolean)) G.sugCount[id]=(G.sugCount[id]||0)+1;
  const prev=G.suggestN>1?Object.values(G.field).filter(Boolean):[];
  for(const pos of order){
    let best=null,bs=-1e9;
    for(const p of avail){ if(used.has(p.id)||!p.auto.includes(ROLE[pos])) continue;
      let s=(maxStarts-(p.starts||0))*2 + (p.benchStarts||0)*1 + (p.primary===ROLE[pos]?3:0) + (p.group==='core'?2:p.group==='dev'?0:-1);
      const qi=(S.queues[ROLE[pos]]||[]).indexOf(p.id); if(qi===0) s+=1;
      s-=(G.sugCount[p.id]||0)*3; if(prev.includes(p.id)) s-=2;
      if(ROLE[pos]==='GK' && !S.settings.gkAuto && p.primary==='GK') s+=10; // keep the real keeper unless GK rotation is on
      if(S.settings.balance && lineupWeak({...field,[pos]:p.id})>S.settings.weakMax) s-=20;
      if(s>bs){bs=s;best=p;} }
    field[pos]=best?best.id:null; if(best) used.add(best.id);
  }
  for(const pos of POSID) G.field[pos]=field[pos]||null;
  save(); render();
}

/* ====================== EVENTS ====================== */
const VIEWER_OK=new Set(['chatdel','forcepull','team','teamjoin','teamcreate','teamback','teamjoingo','teamcreatego','teamleave','close','goalsheet','showlog','history','chatquick','chatname','chatnamesave','synctest','applyupdate','checkupdate','builtin','gotoqueues','guide','setrole','role','resume','tog']);
function act(a,d,el){
  if(isViewer()&&!VIEWER_OK.has(a)) return;
  if(isViewer()&&a==='tog'&&d.k!=='autoUpdate') return;
  switch(a){
    case 'start': startClock(); break;
    case 'pause': stopClock(); break;
    case 'halftime': halftime(); return;
    case 'second': secondHalf(); return;
    case 'end': sheetConfirm('End the game and save the summary?','endgame','End game'); return;
    case 'endgame': closeSheet(); endGame(); return;
    case 'edittime': sheetEditTime(); return;
    case 'etq': $('#et_m').value=d.m; $('#et_s').value='00'; return;
    case 'etapply': case 'etclock': { const v=(+$('#et_m').value||0)*60+(+$('#et_s').value||0); closeSheet(); editClock(v,a==='etapply'); return; }
    case 'adv': advance(+d.m); return;
    case 'testtimers': S.settings.testTimers=!S.settings.testTimers; break;
    case 'makesub': makeSub(d.in,d.out,d.pos,false); return;
    case 'makeall': { const r=recommendation(clock()); makeSubs(r.picks||[]); return; }
    case 'altsub': G.altIdx++; break;
    case 'undo': undo(); return;
    case 'fieldtap': if(G.phase==='setup') sheetPickFor(posOf(d.id)); else sheetField(d.id); return;
    case 'pickfor': sheetPickFor(d.pos); return;
    case 'benchtap': sheetBench(d.id); return;
    case 'setuppick': sheetBench(d.id); return;
    case 'subin': { closeSheet(); const out=G.field[d.pos]; if(out) makeSub(d.id,out,d.pos,true); else { pushUndo(); const pi=ps(d.id); const c=clock(); pi.maxBench=Math.max(pi.maxBench,c-pi.since); pi.since=c; pi.onField=true; pi.positions[d.pos]=(pi.positions[d.pos]||0)+1; G.field[d.pos]=d.id; queueRotate(d.pos,d.id,null); G.subs.push({t:c,inId:d.id,outId:null,pos:d.pos,manual:true}); } break; }
    case 'swap': closeSheet(); swapField(d.id,d.b); return;
    case 'assign': { closeSheet(); const prev=posOf(d.id); if(prev) G.field[prev]=null; G.field[d.pos]=d.id; break; }
    case 'unassign': closeSheet(); G.field[d.pos]=null; break;
    case 'suggest': suggestLineup(); return;
    case 'clearlineup': for(const p of POSID) G.field[p]=null; break;
    case 'kickoff': G.opponent=($('#opp')||{}).value||''; kickoff(); return;
    case 'newgame': newGame(); break;
    case 'addplayer': sheetPlayer(null); return;
    case 'editplayer': sheetPlayer(d.id); return;
    case 'pchip': el.classList.toggle(d.k==='auto'?'on':'on2'); return;
    case 'saveplayer': {
      const id=$('#pl_id').value||uid(); const auto=[...document.querySelectorAll('.chips[data-k=auto] .chip.on')].map(x=>x.dataset.pos); const manual=[...document.querySelectorAll('.chips[data-k=manual] .chip.on2')].map(x=>x.dataset.pos).filter(x=>!auto.includes(x));
      const name=$('#pl_name').value.trim()||'Player'; const num=$('#pl_num').value.trim(); const primary=$('#pl_primary').value; const group=$('#pl_group').value;
      let p=player(id); if(!p){ p={id,avail:true,starts:0,benchStarts:0,games:0}; S.roster.push(p); }
      Object.assign(p,{name,num,primary,auto:auto.length?auto:[primary],manual,group}); syncQueues(); closeSheet(); break; }
    case 'delplayer': { S.roster=S.roster.filter(p=>p.id!==d.id); if(G){ for(const pos of POSID) if(G.field[pos]===d.id) G.field[pos]=null; } syncQueues(); closeSheet(); break; }
    case 'toggleavail': { const p=player(d.id); p.avail=!p.avail; if(!p.avail&&G){ for(const pos of POSID) if(G.field[pos]===d.id) G.field[pos]=null; } break; }
    case 'tog': S.settings[d.k]=!S.settings[d.k]; break;
    case 'num': { const inp=$('#set_'+d.k); const v=Math.min(+inp.max,Math.max(+inp.min,(+inp.value||0)+(+d.d))); S.settings[d.k]=v; break; }
    case 'history': sheetHistory(); return;
    case 'showlog': openSheet('<h2>Subs this game</h2>'+(G.subs.length?'<div class="hist">'+G.subs.slice().reverse().map(logLine).join('')+'</div>':'<div class="card">No subs yet.</div>')+'<button class="btn ghost wide" data-a="close">Close</button>'); return;
    case 'delhist': S.history.splice(+d.i,1); save(); sheetHistory(); return;
    case 'resetroster': sheetConfirm('Reset roster to the default team? Starts history is lost.','doresetroster','Reset roster'); return;
    case 'doresetroster': S.roster=defaultRoster(); S.queues=defaultQueues(); closeSheet(); break;
    case 'wipe': sheetConfirm('Erase roster, settings, current game and history?','dowipe','Erase everything'); return;
    case 'dowipe': try{localStorage.removeItem(LS);}catch(e){} S={settings:{...DEFAULT_SETTINGS},roster:defaultRoster(),queues:defaultQueues(),game:null,history:[],tab:'game',updatedAt:0,syncUrl:SYNC_BASE,chat:[],chatName:'',role:'',team:null}; closeSheet(); save(true); render(); sheetTeam(true); return;
    case 'synctest': S.syncUrl=($('#set_syncUrl').value||'').trim(); SYNC.status='pending'; save(true); joinSync(); pullChat(); render(); return;
    case 'goalus_pick': sheetGoal(); return;
    case 'goalus': closeSheet(); addGoal(true,d.id||null); return;
    case 'goalthem': addGoal(false,null); return;
    case 'goalsheet': sheetGoals(); return;
    case 'goaldel': removeGoal(d.id); sheetGoals(); return;
    case 'chatquick': sendChat(d.q); return;
    case 'chatname': sheetChatName(''); return;
    case 'chatnamesave': { S.chatName=($('#cn').value||'').trim(); closeSheet(); save(true); if(d.pending) sendChat(d.pending); else render(); return; }
    case 'gotoqueues': S.tab='queues'; break;
    case 'applyupdate': applyUpdate(); return;
    case 'pushupdate': openSheet('<h2>Send this version to every team</h2><div class="field"><label for="adm">Admin code</label><input id="adm" autocomplete="off"></div><button class="btn act big wide" data-a="pushupdatego">Send</button><button class="btn ghost wide" data-a="close">Cancel</button>'); return;
    case 'pushupdatego': if(($('#adm').value||'').trim()!==ADMIN_CODE){ $('#adm').value=''; $('#adm').placeholder='Wrong code'; return; } closeSheet(); pushUpdate(); return;
    case 'checkupdate': UPD.avail=0; checkUpdate().then(()=>{ if(!UPD.avail) openSheet('<h2>You have the latest version</h2><button class="btn ghost wide" data-a="close">Close</button>'); }); return;
    case 'builtin': useBuiltIn(); return;
    case 'setrole': if(d.r==='coach'&&teamPin()&&pinHash(($('#rp_pin')&&$('#rp_pin').value||'').trim())!==teamPin()){ const e=$('#rp_err'); if(e) e.textContent='Wrong coach PIN.'; return; } S.role=d.r; closeSheet(); save(true); if(!S.seenGuide&&S.role==='coach'){ S.seenGuide=true; guide(); } render(); return;
    case 'role': sheetRole(false); return;
    case 'team': sheetTeam(false); return;
    case 'editteam': openSheet('<h2>Team</h2><div class="field"><label for="et_name">Team name</label><input id="et_name" value="'+esc(TEAMNAME())+'"></div><div class="field"><label for="et_coach">Coach</label><input id="et_coach" value="'+esc(COACHNAME())+'"></div><div class="field"><label for="et_pin">New coach PIN (leave blank to keep)</label><input id="et_pin" inputmode="numeric" autocomplete="off" placeholder="4 to 6 digits"></div><button class="btn act big wide" data-a="editteamsave">Save</button><button class="btn ghost wide" data-a="close">Cancel</button>'); return;
    case 'editteamsave': { const np=($('#et_pin').value||'').trim(); S.team={...S.team,name:$('#et_name').value.trim()||S.team.name,coach:$('#et_coach').value.trim(),...(np?{pin:pinHash(np)}:{})}; closeSheet(); break; }
    case 'teamjoin': sheetTeamJoin(); return;
    case 'teamcreate': sheetTeamCreate(); return;
    case 'teamback': sheetTeam(!S.team); return;
    case 'teamjoingo': joinTeam($('#tj_code').value,d.r); return;
    case 'teamcreatego': createTeam(); return;
    case 'teamleave': S.team=null; S.role=''; S.game=null; S.history=[]; S.chat=[]; S.updatedAt=0; closeSheet(); save(true); render(); sheetTeam(true); return;
    case 'forcepull': pullSync(true).then(render); return;
    case 'forcepush': S.updatedAt=Math.max(Date.now(),SYNC.remoteAt+1); SYNC.pushedHash=''; pushSync().then(render); return;
    case 'resetgame': newGame(); break;
    case 'chatdel': deleteChat(d.id); return;
    case 'chatclear': sheetConfirm('Delete every chat message for the whole team?','chatclearconfirm','Clear chat'); return;
    case 'chatclearconfirm': closeSheet(); clearChat(); return;
    case 'guide': guide(); return;
    case 'close': closeSheet(); return;
    case 'resume': $('#resume').remove(); return;
    case 'discard': $('#resume').remove(); newGame(); break;
  }
  save(); render();
}

/* live tick: update numbers in place, re-render pieces only when they change */
let lastRecKey='', lastWarnKey='', lastDue=null;
setInterval(()=>{
  if(!G||G.phase==='setup'||G.phase==='done') return;
  const c=clock(); const st=S.settings;
  document.querySelectorAll('[data-live]').forEach(el=>{
    const [k,id]=el.dataset.live.split(':');
    if(k==='clock') el.textContent=fmt(c);
    else if(k==='chk'){ const due=c-G.lastCheck>=st.subInterval*60; el.textContent=due?'NOW':fmt(G.lastCheck+st.subInterval*60-c); el.classList.toggle('due',due); }
    else if(k==='pl') el.textContent=fmt(played(id,c));
    else if(k==='bs') el.textContent=fmt(benchStint(id,c));
    else if(k==='fs') el.textContent=fmt(fieldStint(id,c));
  });
  if(S.tab==='game' && G.running){
    const due=c-G.lastCheck>=st.subInterval*60;
    const rec=recommendation(c); const key=rec.first?rec.first.inId+rec.first.outId+rec.first.pos+(rec.second?rec.second.inId+rec.second.outId:''):'none';
    const warns=availRoster().map(p=>({p,s:ptStatus(p.id,c)})).filter(x=>x.s.code==='priority'||x.s.code==='cant'); const wk=warns.map(x=>x.p.id).join(',');
    const halfEnd=(G.phase==='h1'&&c>=halfSecs())||(G.phase==='h2'&&c>=gameSecs());
    if(key!==lastRecKey||due!==lastDue||wk!==lastWarnKey||halfEnd){ lastRecKey=key; lastDue=due; lastWarnKey=wk; render(); }
  }
  if(S.tab==='minutes' && G.running && Math.floor(c)%5===0) render();
  if(G.running && Math.floor(c)%15===0) save(true);
},1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) render(); });

/* first-run guide */
function guide(){ openSheet('<h2>'+esc(TEAMNAME())+'</h2><div class="sub2" style="font-weight:800">How it works:</div><div class="opt"><div><div class="nm">1. Before the game</div><div class="sub2">Tap who is here, tap Suggest lineup, tap Kickoff.</div></div></div><div class="opt"><div><div class="nm">2. At kickoff</div><div class="sub2">Tap Start clock. Forgot? Tap the time and type what the ref has.</div></div></div><div class="opt"><div><div class="nm">3. During the game</div><div class="sub2">The orange box tells you one sub to make. Tap Make this sub when you do it. That is the whole job.</div></div></div><div class="opt"><div><div class="nm">4. Overrides</div><div class="sub2">Tap any field player to take him out, any bench player to put him in, Undo if you tapped wrong.</div></div></div><button class="btn act big wide" data-a="close">Got it</button>'); }
function codeOk(c){ return /^[A-Z0-9]{4,12}$/.test(c); }
function pinHash(pin){ let h=5381; const str='sidelinesub:'+String(pin||''); for(let i=0;i<str.length;i++) h=((h*33)^str.charCodeAt(i))>>>0; return h.toString(36); }
function pinOk(p){ return /^\d{4,6}$/.test(p||''); }
function teamPin(){ return S.team&&S.team.pin||''; }

    +'<button class="btn act big wide" data-a="teamcreatego">Create team</button><button class="btn ghost wide" data-a="teamback">Back</button>');

async function joinTeam(code,role){
  const err=$('#tj_err'); code=(code||'').trim().toUpperCase();
  if(!codeOk(code)){ err.textContent='Code must be 4 to 12 letters or numbers.'; return; }
  err.textContent='Looking up team…';
  try{ const r=await fetch(S.syncUrl+'/teams/'+encodeURIComponent(code)+'/state/state/team.json?t='+Date.now(),{cache:'no-store'}); const t=await r.json();
    if(!t||!t.code){ err.textContent='No team with that code. Check with your coach.'; return; }
    if(role==='coach'&&t.pin&&pinHash(($('#tj_pin')&&$('#tj_pin').value||'').trim())!==t.pin){ err.textContent='Wrong coach PIN. Ask the coach, or join as a viewer.'; return; }
    S.team=t; S.role=role; S.updatedAt=0; S.game=null; S.history=[]; S.chat=[]; closeSheet(); save(true); await joinSync(); pullChat(); render();
    if(role==='coach'&&!S.seenGuide){ S.seenGuide=true; save(true); guide(); }
  }catch(e){ err.textContent='Could not reach the team server. Check your signal.'; }
}
async function createTeam(){
  const err=$('#tc_err'); const name=($('#tc_name').value||'').trim(), coach=($('#tc_coach').value||'').trim(), code=($('#tc_code').value||'').trim().toUpperCase();
  if(!name){ err.textContent='Team name is required.'; return; }
  if(!codeOk(code)){ err.textContent='Code must be 4 to 12 letters or numbers.'; return; }
  const pin=($('#tc_pin').value||'').trim(); if(!pinOk(pin)){ err.textContent='PIN must be 4 to 6 digits.'; return; }
  err.textContent='Checking code…';
  try{ const r=await fetch(S.syncUrl+'/teams/'+encodeURIComponent(code)+'/state/updatedAt.json?t='+Date.now(),{cache:'no-store'}); const taken=await r.json();
    if(taken){ err.textContent='That code is taken. Pick another.'; return; }
    S.team={name,coach,code,created:Date.now(),pin:pinHash(pin)}; S.role='coach'; S.roster=defaultRoster(); S.queues=defaultQueues(); S.game=null; S.history=[]; S.chat=[]; S.updatedAt=Date.now(); lastTeamHash='';
    closeSheet(); save(); await pushSync(); render();
    openSheet('<h2>Team created</h2><div class="center"><div class="lbl">Your team code</div><div class="clock" style="margin:8px 0">'+esc(code)+'</div><div class="sub2" style="font-weight:700;color:var(--mut)">Give the code to parents and assistants. Coaches also need the PIN you just set (viewers do not). Edit your roster under the Roster tab.</div></div><button class="btn act big wide" data-a="close">Got it</button>');
    if(!S.seenGuide){ S.seenGuide=true; save(true); }
  }catch(e){ err.textContent='Could not reach the team server. Check your signal.'; }
}
function sheetRole(first){ openSheet('<h2>Who is using this phone?</h2>'+(teamPin()?'<div class="field"><label for="rp_pin">Coach PIN (needed for Coach)</label><input id="rp_pin" inputmode="numeric" autocomplete="off" placeholder="••••" style="font-size:22px;font-weight:900;letter-spacing:.2em"></div><div id="rp_err" class="sub2" style="color:var(--bad);font-weight:800"></div>':'')+'<button class="opt" data-a="setrole" data-r="coach"><div><div class="nm">Coach</div><div class="sub2">Runs the clock, subs and score</div></div><span class="arrow">›</span></button><button class="opt" data-a="setrole" data-r="viewer"><div><div class="nm">Viewer</div><div class="sub2">Parent or assistant: watch the lineup, next sub, score and minutes, and use the chat. Cannot change anything.</div></div><span class="arrow">›</span></button>'+(first?'':'<button class="btn ghost wide" data-a="close">Cancel</button>')); }
